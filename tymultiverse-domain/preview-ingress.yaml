apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tymultiverse-domain-frontend
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tymultiverse.cc
      secretName: tymultiverse-cc-tls
  rules:
    - host: tymultiverse.cc
      http:
        paths:
          - path: /tymultiverse
            pathType: Prefix
            backend:
              service:
                name: ty-multiverse-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tymultiverse-domain-root
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /tymultiverse/$1
spec:
  ingressClassName: nginx
  rules:
    - host: tymultiverse.cc
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ty-multiverse-frontend
                port:
                  number: 80
