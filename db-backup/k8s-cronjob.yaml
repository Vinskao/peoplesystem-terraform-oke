# Daily logical backups of the application (`peoplesystem`) and Keycloak (`postgres`) databases to the OCI
# `peoplesystem-db-backup` bucket. No stored OCI keys — uploads via Instance Principal
# (authorized by the dynamic group + policy in this module's iam.tf).
#
# Flow: initContainer (postgres image) runs a verified pg_dump into a shared emptyDir, then the main
# container (OCI CLI image) uploads the dump with `oci os object put --auth instance_principal`.
#
# Apply: kubectl apply -k .
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-backup-config
  namespace: default
data:
  # in-cluster Postgres (the StatefulSet service)
  PGHOST: "postgres"
  PGPORT: "5432"
  PGDATABASE: "peoplesystem"
  PGUSER: "postgres"
  # OCI Object Storage target
  OCI_NAMESPACE: "axbptfyngj39"
  OCI_BUCKET: "peoplesystem-db-backup"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-db-backup-config
  namespace: default
data:
  PGHOST: "postgres"
  PGPORT: "5432"
  PGDATABASE: "postgres"
  PGUSER: "postgres"
  BACKUP_NAME: "keycloak-postgres"
  OCI_NAMESPACE: "axbptfyngj39"
  OCI_BUCKET: "peoplesystem-db-backup"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: default
spec:
  schedule: "0 19 * * *" # 19:00 UTC = 03:00 Asia/Taipei daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: dump
              emptyDir: {}
            - name: scripts
              configMap:
                name: db-backup-scripts
          initContainers:
            - name: pg-dump
              image: postgres:17.4
              envFrom:
                - configMapRef:
                    name: db-backup-config
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: postgres-password
              command: ["/bin/bash", "/scripts/pg-dump.sh"]
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: upload
              image: ghcr.io/oracle/oci-cli:latest
              envFrom:
                - configMapRef:
                    name: db-backup-config
              command: ["/bin/bash", "/scripts/upload-backup.sh"]
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-db-backup
  namespace: default
spec:
  schedule: "30 19 * * *" # 19:30 UTC = 03:30 Asia/Taipei daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: dump
              emptyDir: {}
            - name: scripts
              configMap:
                name: db-backup-scripts
          initContainers:
            - name: pg-dump
              image: postgres:17.4
              envFrom:
                - configMapRef:
                    name: keycloak-db-backup-config
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: postgres-password
              command: ["/bin/bash", "/scripts/pg-dump.sh"]
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: upload
              image: ghcr.io/oracle/oci-cli:latest
              envFrom:
                - configMapRef:
                    name: keycloak-db-backup-config
              command: ["/bin/bash", "/scripts/upload-backup.sh"]
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
