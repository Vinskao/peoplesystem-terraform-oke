# Preserve the original From/DKIM; ARC records the checks made before forwarding.
sign_local = true;
sign_authenticated = true;
sign_inbound = true;
use_domain = "recipient";
use_esld = false;
allow_hdrfrom_mismatch = true;
domain {
  peoplesystem.tatdvsonorth.com {
    selector = "arc2026";
    path = "/tmp/docker-mailserver/rspamd/dkim/arc.key";
  }
}
