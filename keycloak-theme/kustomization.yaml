apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

configMapGenerator:
  - name: keycloak-login-theme
    files:
      - theme.properties=ty-multiverse/login/theme.properties
      - login.css=ty-multiverse/login/resources/css/login.css
generatorOptions:
  disableNameSuffixHash: true
